<!DOCTYPE html>
<html>
<head>
<title>Pasport Kesihatan</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>❤️ MARVION</h1>
<p>Platform Komunikasi Penjagaan Kesihatan Pintar</p>
</header>

<main>

<h2>🩺 Pasport Kesihatan</h2>

<p>Nama</p>
<input type="text">

<p>Kumpulan Darah</p>
<input type="text">

<p>Alahan</p>
<input type="text">

<h3>🩺 Penyakit Sedia Ada</h3>

<label>
  <input type="checkbox" name="penyakit" value="Kencing Manis">
  Kencing Manis
</label><br>

<label>
  <input type="checkbox" name="penyakit" value="Darah Tinggi">
  Darah Tinggi
</label><br>

<label>
  <input type="checkbox" name="penyakit" value="Penyakit Jantung">
  Penyakit Jantung
</label><br>

<label>
  <input type="checkbox" name="penyakit" value="Asma">
  Asma
</label><br>

<label>
  <input type="checkbox" name="penyakit" value="Kanser">
  Kanser
</label><br>

<label>
  <input type="checkbox" name="penyakit" value="Lain-lain">
  Lain-lain
</label>
    
<br><br>

<button type="button" onclick="simpanMaklumat()">Simpan Maklumat</button>

<p><a href="index.html">⬅ Kembali ke Laman Utama</a></p>

</main>

<script>
function simpanMaklumat() {
    let input = document.querySelectorAll('input[type="text"]');

    let nama = input[0].value;
    let darah = input[1].value;
    let alahan = input[2].value;
    let penyakitDipilih = document.querySelectorAll('input[name="penyakit"]:checked');
let penyakit = Array.from(penyakitDipilih)
  .map(item => item.value)
  .join(", ");

if (penyakit === "") {
  penyakit = "Tiada";
}
    
    if (nama === "" || darah === "" || alahan === "") {
        alert("⚠️ Sila lengkapkan semua maklumat kesihatan.");
        return;
    }

   let maklumatKesihatan = {
    nama: nama,
    darah: darah,
    alahan: alahan,
    penyakit: penyakit
};

    localStorage.setItem("maklumatKesihatan", JSON.stringify(maklumatKesihatan));

    alert("✅ Maklumat kesihatan " + nama + " berjaya disimpan.");
}
</script>
  
<footer>
<p>© 2026 MARVION</p>
</footer>

</body>
</html>
