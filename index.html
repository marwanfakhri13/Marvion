      margin: 10px 0 22px;

      margin-top: 6px;
    }

    footer {
      text-align: center;
    }

    @media (max-width: 600px) {

      main {
        padding: 15px 12px 20px;
      }

      main h2 {
        font-size: 27px;
        margin: 5px 0 18px;
      }

      .menu {
        gap: 10px;
      }

      .menu .card {
        padding: 18px 12px;
      }
