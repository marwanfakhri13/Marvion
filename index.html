<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marvion | Smart Healthcare Communication Platform</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Kemasan halaman utama */
        main {
            text-align: center;
            max-width: 700px;
            margin: auto;
            padding: 20px 15px 25px;
        }

        main h2 {
            text-align: center;
            margin: 10px 0 22px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .menu .card {
            width: 92%;
            max-width: 550px;
            display: block;
            margin: 0;
            padding: 20px 15px;
            text-align: center;
        }

        .menu .card small {
            display: block;
            margin-top: 5px;
        }

        footer {
            text-align: center;
        }

        @media (max-width: 600px) {

            main {
                padding: 15px 10px 20px;
            }

            main h2 {
                font-size: 22px;
                margin: 10px 0 18px;
                line-height: 1.3;
            }

            .menu {
                gap: 10px;
            }

            .menu .card {
                width: 92%;
                padding: 18px 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <img
            src="marvion-logo.png"
            alt="MARVION Smart Healthcare Communication Platform"
            class="logo"
            style="width: 180px; height: auto; display: block; margin: 0 auto;">
    </header>

    <hr>

    <main>

        <h2>👋 Selamat Datang ke MARVION 👋</h2>

        <div class="menu">

            <!-- 1. TEMPAHAN JANJI TEMU -->
            <a href="appointment.html" class="card">
                📅 Tempahan Janji Temu
            </a>

            <!-- 2. PASSPORT KESIHATAN -->
            <a href="passport.html" class="card">
                🩺 Passport Kesihatan
            </a>

            <!-- 3. DAPATKAN NOMBOR GILIRAN -->
            <a href="queue.html" class="card">
                🎟️ Dapatkan Nombor Giliran
            </a>

            <!-- 4. PERINGATAN UBAT -->
            <a href="medicine.html" class="card">
                💊 Peringatan Ubat
            </a>

            <!-- 5. PANDUAN KECEMASAN -->
            <a href="emergency.html" class="card">
                🚨 Panduan Kecemasan
            </a>

            <!-- 6. HUBUNGI KLINIK -->
            <a href="contact.html" class="card">
                📞 Hubungi Klinik
            </a>

            <!-- 7. MOD KECEMASAN -->
            <a href="emergency-mode.html" class="card emergency-card">
                🚨 EMERGENCY MODE

            </a>

    </main>

    <hr>

    <footer>
