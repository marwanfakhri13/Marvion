<!DOCTYPE html>
<html>
<head>
    <title>Semakan Giliran</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>❤️ MARVION</h1>
    <p>Platform Komunikasi Penjagaan Kesihatan Pintar</p>
</header>

<main>

<h2>⏳ Semakan Giliran</h2>

<p>Masukkan nombor giliran anda.</p>

<input type="text" placeholder="Contoh: A102">

<br><br>

<button type="button" onclick="semakGiliran()">Semak Giliran</button>

<p id="status">Status: Sila tunggu giliran anda.</p>

<p><a href="index.html">⬅ Kembali ke Laman Utama</a></p>

<script>
function semakGiliran() {
    let nombor = document.querySelector("input").value;

    if (nombor === "") {
        document.getElementById("status").innerText =
            "Status: Sila masukkan nombor giliran.";
    } else {
        document.getElementById("status").innerText =
            "Status: Giliran " + nombor + " sedang diproses.";
    }
}
</script>
</main>

<footer>
<p>© 2026 MARVION</p>
</footer>

</body>
</html>
