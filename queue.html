<!DOCTYPE html>
<html>
<head>
    <title>Semakan Giliran</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>❤️ MARVION</h1>
    <p>Platform Komunikasi Penjagaan Kesihatan Pintar</p>
</header>

<main>

<h2>⌛ Semakan Giliran</h2>

<p>Masukkan nombor giliran anda untuk menyemak status.</p>

<div class="queue-box">

<label for="queueNumber">🎫 Nombor Giliran</label>

<input 
    type="text" 
    id="queueNumber"
    placeholder="Contoh: A102"
>

<button type="button" onclick="semakGiliran()">
    🔍 Semak Giliran
</button>

</div>

<div id="status" class="queue-status">
    Status: Sila masukkan nombor giliran anda.
</div>

<p>
    <a href="index.html">⬅ Kembali ke Laman Utama</a>
</p>

</main>
    
<script>
function semakGiliran() {

    let nombor = document.getElementById("queueNumber").value.trim();

    if (nombor === "") {

        document.getElementById("status").innerHTML =
        "⚠️ Sila masukkan nombor giliran.";

        return;
    }

    nombor = nombor.toUpperCase();

    document.getElementById("status").innerHTML =
    "🟢 <strong>Giliran " + nombor + "</strong><br>" +
    "Sedang dipanggil ke Bilik 3.<br>" +
    "Sila bersedia dan tunggu arahan petugas.";
   }
}
</script>
</main>

<footer>
<p>© 2026 MARVION</p>
</footer>

</body>
</html>
