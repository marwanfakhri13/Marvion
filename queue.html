<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semakan Giliran</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <img src="marvion-logo.png"
         alt="MARVION Smart Healthcare Communication Platform"
         class="logo">
</header>

<hr>

<main>

    <h2>⌛ Semakan Giliran</h2>

    <p class="arahan">
        Masukkan nombor giliran anda untuk menyemak status.
    </p>

    <form id="queueForm">

        <label for="nombor">
            🎫 Nombor Giliran
        </label>

        <input
            type="text"
            id="nombor"
            placeholder="Contoh: A102"
        >

        <button type="button" onclick="semakGiliran()">
            🔍 Semak Giliran
        </button>

    </form>

    <div id="status">
        Status: Sila masukkan nombor giliran anda.
    </div>

    <p>
        <a href="index.html">⬅ Kembali ke Laman Utama</a>
    </p>

</main>

<footer>
    <p>© 2026 MARVION</p>
</footer>

<script>
function semakGiliran() {

    let nombor = document.getElementById("nombor").value.trim();

    if (nombor === "") {

        document.getElementById("status").innerHTML =
            "⚠️ Sila masukkan nombor giliran anda.";

    } else {

        document.getElementById("status").innerHTML =
            "🟢 Giliran " + nombor +
            "<br>Sedang dipanggil ke Bilik 3." +
            "<br>Sila bersedia dan tunggu arahan petugas.";
    }
}
</script>

</body>
</html>
