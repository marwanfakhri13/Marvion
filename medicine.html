<button type="button" onclick="simpanPeringatan()">
            💾 Simpan Peringatan
        </button>

        <div id="mesej"></div>

        <div class="nota">
            <h3>🔔 Nota Penting</h3>
            <p>
                Pastikan anda mengambil ubat mengikut arahan doktor.
                Jangan berhenti mengambil ubat tanpa nasihat doktor.
            </p>
        </div>

    </div>

    <a href="index.html" class="kembali">
        ← Kembali ke Laman Utama
    </a>

</main>

<footer>

<script>
function simpanPeringatan() {

    let nama = document.getElementById("namaUbat").value.trim();
    let masa = document.getElementById("masaUbat").value;

    if (nama === "" || masa === "") {
        alert("⚠️ Sila lengkapkan nama ubat dan waktu pengambilan.");
        return;
    }

    let mesej = document.getElementById("mesej");

    mesej.style.display = "block";

    mesej.innerHTML =
        "<h3>✅ Peringatan Berjaya Disimpan!</h3>" +
        "<p><b>Nama Ubat:</b> " + nama + "</p>" +
        "<p><b>Waktu Pengambilan:</b> " + masa + "</p>" +
        "<p>🔔 Sila ambil ubat pada waktu yang ditetapkan.</p>";
}
</script>

</body>
</html>
