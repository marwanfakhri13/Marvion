<!DOCTYPE html>
<html>
<head>
    <title>Peringatan Ubat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>❤️ MARVION</h1>
<p>Platform Komunikasi Penjagaan Kesihatan Pintar</p>
</header>

<main>

<h2>💊 Peringatan Ubat</h2>

<p>Nama Ubat</p>
<input type="text">

<p>Waktu Pengambilan</p>
<input type="time">

<br><br>

<button type="button" onclick="simpanUbat()">Simpan</button>

<p><a href="index.html">⬅ Kembali ke Laman Utama</a></p>

</main>

<script>
function simpanUbat() {
    let nama = document.querySelector('input[type="text"]').value;
    let masa = document.querySelector('input[type="time"]').value;

    if (nama === "" || masa === "") {
        alert("Sila masukkan nama ubat dan waktu pengambilan.");
    } else {
        alert("Peringatan ubat " + nama + " ditetapkan pada " + masa + ".");
    }
}
</script>    
    
<footer>
<p>© 2026 MARVION</p>
</footer>

</body>
</html>
