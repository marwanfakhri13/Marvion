<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tempahan Janji Temu | Marvion</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           TETAPAN HALAMAN
           ========================= */

        html {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            min-width: 0;
            margin: 0;
            padding: 0;
            text-align: center;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        /* =========================
           HEADER & LOGO
           ========================= */

        header {
            width: 100%;
            margin: 0;
            padding: 5px 10px;
            text-align: center;
        }

        header .logo {
            width: 150px !important;
            height: auto;
            display: block;
            margin: 5px auto 10px;
        }


        /* =========================
           KANDUNGAN UTAMA
           ========================= */

        main {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px;
            text-align: center;
        }

        main h2 {
            width: 100%;
            margin: 20px auto 15px;
            text-align: center;
            font-size: 28px;
            line-height: 1.3;
        }

        main > p {
            width: 100%;
            max-width: 650px;
            margin: 0 auto 25px;
            text-align: center;
            line-height: 1.6;
            font-size: 16px;
        }


        /* =========================
           BORANG
           ========================= */

        form {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 0;
            text-align: left;
        }

        form label {
            display: block;
            width: 100%;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 16px;
            font-weight: bold;
        }

        form input,
        form select {
            display: block;
            width: 100%;
            max-width: 100%;
            min-height: 50px;
            padding: 12px;
            margin: 0;
            font-size: 16px;
            border-radius: 8px;
            box-sizing: border-box;
        }


        /* =========================
           BUTANG
           ========================= */

        form button {
            display: block;
            width: 100%;
            max-width: 650px;
            min-height: 50px;
            margin: 25px auto;
            padding: 13px 15px;
            font-size: 16px;
            cursor: pointer;
            box-sizing: border-box;
        }


        /* =========================
           PENGESAHAN
           ========================= */

        #pengesahan {
            width: 100%;
            max-width: 650px;
            margin: 25px auto;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        #pengesahan h3 {
            margin-top: 0;
        }

        #pengesahan p {
            margin: 8px 0;
            line-height: 1.5;
        }


        /* =========================
           LINK KEMBALI
           ========================= */

        main > a {
            display: inline-block;
            margin: 20px auto 25px;
            text-align: center;
        }


        /* =========================
           FOOTER
           ========================= */

        footer {
            width: 100% !important;
            max-width: none !important;
            margin: 20px 0 0 !important;
            padding: 18px 12px !important;
            text-align: center !important;
            box-sizing: border-box;
        }

        footer p {
            margin: 5px 0 !important;
            padding: 0 !important;
            line-height: 1.4 !important;
        }


        /* =========================
           PAPARAN TELEFON
           ========================= */

        @media (max-width: 600px) {

            header {
                padding: 5px 8px;
            }

            header .logo {
                width: 150px !important;
                margin: 5px auto 8px;
            }

            main {
                width: 100%;
                max-width: 100%;
                padding: 0 16px;
                margin: 0 auto;
            }

            main h2 {
                font-size: 24px;
                margin-top: 18px;
                margin-bottom: 14px;
            }

            main > p {
                font-size: 15px;
                line-height: 1.5;
                margin-bottom: 22px;
            }

            form {
                width: 100%;
                max-width: 100%;
                margin: 0 auto;
            }

            form label {
                font-size: 16px;
                margin-top: 16px;
                margin-bottom: 6px;
            }

            form input,
            form select {
                width: 100%;
                min-height: 50px;
                padding: 12px;
                font-size: 16px;
            }

            form button {
                width: 100%;
                min-height: 50px;
                margin: 24px auto;
                font-size: 16px;
            }

            #pengesahan {
                width: 100%;
                max-width: 100%;
                margin: 24px auto;
                padding: 18px;
            }

            main > a {
                margin: 18px auto 22px;
            }

            footer {
                width: 100% !important;
                margin: 18px 0 0 !important;
                padding: 16px 10px !important;
            }

            footer p {
                margin: 4px 0 !important;
                line-height: 1.35 !important;
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header>

        <img
            src="marvion-logo.png"
            alt="MARVION Smart Healthcare Communication Platform"
            class="logo"
            style="width:150px; height:auto;"
        >

    </header>


    <!-- =========================
         KANDUNGAN UTAMA
         ========================= -->

    <main>

        <h2>📅 Tempahan Janji Temu</h2>

        <p>
            Tempah janji temu dengan klinik atau hospital
            dengan lebih mudah dan teratur.
        </p>


        <!-- BORANG TEMPAHAN -->

        <form>

            <label for="nama">
                Nama Pesakit
            </label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama"
            >


            <label for="tarikh">
                Tarikh Janji Temu
            </label>

            <input
                type="date"
                id="tarikh"
            >


            <label for="masa">
                Masa
            </label>

            <input
                type="time"
                id="masa"
            >


            <label for="jenis">
                Jenis Temu Janji
            </label>

            <select id="jenis">

                <option>
                    Pemeriksaan Kesihatan
                </option>

                <option>
                    Rawatan Susulan
                </option>

                <option>
                    Konsultasi Doktor
                </option>

                <option>
                    Lain-lain
                </option>

                </select>


            <button
                type="button"
                onclick="hantarTempahan()"
            >
                📩 Hantar Tempahan
            </button>

        </form>


        <!-- RUANG PENGESAHAN -->

        <div id="pengesahan"></div>


        <br>


        <!-- KEMBALI -->

        <a href="index.html">
            🏠 Kembali ke Laman Utama
        </a>

    </main>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        function hantarTempahan() {

            let nama =
                document.getElementById("nama").value;

            let tarikh =
                document.getElementById("tarikh").value;

            let masa =
                document.getElementById("masa").value;

            let jenis =
                document.getElementById("jenis").value;


            /* Semak maklumat */

            if (
                nama === "" ||
                tarikh === "" ||
                masa === ""
            ) {

                alert(
                    "⚠️ Sila lengkapkan semua maklumat tempahan."
                );

                return;
            }


            /* Paparan berjaya */

            alert(
                "📩 Tempahan berjaya dihantar!\n\n" +
                "Nama: " + nama +
                "\nTarikh: " + tarikh +
                "\nMasa: " + masa +
                "\nJenis: " + jenis
            );


            /* Kotak pengesahan */

            document.getElementById("pengesahan").innerHTML =

                "<h3>📅 Tempahan Berjaya!</h3>" +

                "<p><b>Nama:</b> " +
                nama +
                "</p>" +

                "<p><b>Tarikh:</b> " +
                tarikh +
                "</p>" +

                "<p><b>Masa:</b> " +
                masa +
                "</p>" +

                "<p><b>Jenis Temu Janji:</b> " +
                jenis +
                "</p>" +

                "<p>Terima kasih kerana menggunakan MARVION.</p>";

        }

    </script>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer>

        <p>
            © 2026 MARVION
        </p>

        <p>
            Smart Healthcare Communication Platform
        </p>

    </footer>


</body>

</html>
