<main>

    <h2>📅 Tempahan Janji Temu</h2>

    <p>
        Tempah janji temu dengan klinik atau hospital
        dengan lebih mudah dan teratur.
    </p>

    <form>

        <label>Nama Pesakit</label><br>
        <input type="text" placeholder="Masukkan nama"><br><br>

        <label>Tarikh Janji Temu</label><br>
        <input type="date"><br><br>

        <label>Masa</label><br>
        <input type="time"><br><br>

        <label>Jenis Temujanji</label><br>
        <select>
            <option>Pemeriksaan Kesihatan</option>
            <option>Rawatan Susulan</option>
            <option>Konsultasi Doktor</option>
            <option>Lain-lain</option>
        </select><br><br>

        <button type="button" onclick="alert('Janji temu berjaya dihantar!')">
            ✅ Hantar Tempahan
        </button>

    </form>

    <br>

    <a href="index.html">⬅️ Kembali ke Laman Utama</a>
