<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">

    <!-- Penting untuk paparan telefon -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tempahan Janji Temu | Marvion</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Tetapan khas halaman Temujanji */
        body {
            margin: 0;
            text-align: center;
        }

        header {
            text-align: center;
        }

        header .logo {
            width: 150px !important;
            height: auto;
            display: block;
            margin: 5px auto 10px;
        }

        main {
            width: calc(100% - 30px);
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        main h2 {
            text-align: center;
            font-size: 28px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        main > p {
            max-width: 650px;
            margin: 0 auto 25px;
            line-height: 1.6;
            font-size: 16px;
        }

        form {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            text-align: left;
        }

        form label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 16px;
        }

        form input,
        form select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
        }

        form button {
            display: block;
            width: 100%;
            max-width: 650px;
            margin: 25px auto;
            padding: 13px 15px;
            font-size: 16px;
            cursor: pointer;
        }

        #pengesahan {
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
            margin: 25px auto;
            text-align: center;
        }

        main > a {
            display: inline-block;
            margin: 20px auto;
            text-align: center;
        }

        footer {
            text-align: center;
        }

        /* Paparan telefon */
        @media (max-width: 600px) {

            header .logo {
                width: 150px !important;
            }

            main {
                width: calc(100% - 24px);
            }

            main h2 {
                font-size: 24px;
                line-height: 1.3;
            }

            main > p {
                font-size: 15px;
                line-height: 1.5;
            }

            form label {
                font-size: 16px;
            }

            form input,
            form select {
                font-size: 16px;
                padding: 13px 12px;
            }

            form button {
                font-size: 16px;
                padding: 14px 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <img
            src="marvion-logo.png"
            alt="MARVION Smart Healthcare Communication Platform"
            class="logo"
            style="width:150px; height:auto;"
        >
    </header>

    <main>

        <h2>📅 Tempahan Janji Temu</h2>

        <p>
            Tempah janji temu dengan klinik atau hospital
            dengan lebih mudah dan teratur.
        </p>

        <form>

            <label for="nama">Nama Pesakit</label>
            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama"
            >

            <label for="tarikh">Tarikh Janji Temu</label>
            <input
                type="date"
                id="tarikh"
            >

            <label for="masa">Masa</label>
            <input
                type="time"
                id="masa"
            >

            <label for="jenis">Jenis Temu Janji</label>

            <select id="jenis">
                <option>Pemeriksaan Kesihatan</option>
                <option>Rawatan Susulan</option>
                <option>Konsultasi Doktor</option>
                <option>Lain-lain</option>
            </select>

            <button
                type="button"
                onclick="hantarTempahan()"
            >
                📩 Hantar Tempahan
            </button>

        </form>

        <div id="pengesahan"></div>

        <br>

        <a href="index.html">
            🏠 Kembali ke Laman Utama
        </a>

    </main>

    <script>

        function hantarTempahan() {

            let nama =
                document.getElementById("nama").value;

            let tarikh =
                document.getElementById("tarikh").value;

            let masa =
                document.getElementById("masa").value;

            let jenis =
                document.getElementById("jenis").value;


            if (
                nama === "" ||
                tarikh === "" ||
                masa === ""
            ) {

                alert(
                    "⚠️ Sila lengkapkan semua maklumat tempahan."
                );

                return;
            }


            alert(
                "📩 Tempahan berjaya dihantar!\n\n" +
                "Nama: " + nama +
                "\nTarikh: " + tarikh +
                "\nMasa: " + masa +
                "\nJenis: " + jenis
            );


            document.getElementById("pengesahan").innerHTML =

                "<h3>📅 Tempahan Berjaya!</h3>" +

                "<p><b>Nama:</b> " +
                nama +
                "</p>" +

                "<p><b>Tarikh:</b> " +
                tarikh +
                "</p>" +

                "<p><b>Masa:</b> " +
                masa +
                "</p>" +

                "<p><b>Jenis Temu Janji:</b> " +
                jenis +
                "</p>" +

                "<p>Terima kasih kerana menggunakan MARVION.</p>";

        }

    </script>


    <footer>

        <p>
            © 2026 MARVION
        </p>

        <p>
            Smart Healthcare Communication Platform
        </p>

    </footer>

</body>

</html>
