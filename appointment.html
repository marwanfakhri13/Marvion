<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tempahan Janji Temu | MARVION</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* ================================
           HALAMAN TEMPAHAN JANJI TEMU
           ================================ */

        main {
            max-width: 700px;
            margin: auto;
            padding: 20px 15px 35px;
        }

        main h2 {
            text-align: center;
            margin: 5px 0 15px;
            line-height: 1.3;
        }

        .intro {
            text-align: center;
            font-size: 18px;
            line-height: 1.5;
            margin: 0 auto 25px;
        }

        /* Kotak utama borang */
        .appointment-form {
            background: white;
            border-radius: 20px;
            padding: 22px 20px 25px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
            border: 2px solid #dcefe9;
            box-sizing: border-box;
        }

        /* Setiap ruangan */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #0d1b3d;
        }

        /* Input dan pilihan */
        .form-group input,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            font-size: 17px;
            font-family: Arial, sans-serif;
            border: 2px solid #dcefe9;
            border-radius: 10px;
            background: #fbfefd;
            color: #222;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #159b72;
        }

        /* Butang hantar */
        .submit-button {
            width: 100%;
            box-sizing: border-box;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            background: #099b70;
            color: white;
            cursor: pointer;
            margin-top: 2px;
        }

        .submit-button:active {
            transform: scale(0.99);
        }

        /* Kotak pengesahan */
        .success {
            display: none;
            background: #effcf6;
            border: 2px solid #159b72;
            border-radius: 18px;
            padding: 22px 18px;
            margin-top: 28px;
            text-align: center;
            color: #0d1b3d;
            box-sizing: border-box;
        }

        .success h3 {
            color: #247653;
            font-size: 22px;
            margin: 0 0 18px;
        }

        .success p {
            font-size: 17px;
            line-height: 1.5;
            margin: 10px 0;
        }

        .back-link {
            display: block;
            width: fit-content;
            margin: 45px auto 10px;
            text-align: center;
        }

        footer {
            text-align: center;
        }

        /* ================================
           PAPARAN TELEFON
           ================================ */

        @media (max-width: 600px) {

            main {
                padding: 18px 10px 30px;
            }

            main h2 {
                font-size: 22px;
                margin: 5px 0 14px;
            }

            .intro {
                font-size: 17px;
                line-height: 1.5;
                margin-bottom: 25px;
            }

            .appointment-form {
                width: 100%;
                padding: 20px 18px 25px;
                border-radius: 18px;
            }

            .form-group {
                margin-bottom: 19px;
            }

            .form-group label {
                font-size: 18px;
                margin-bottom: 7px;
            }

        .form-group input,
            .form-group select {
                width: 100%;
                padding: 14px 14px;
                font-size: 17px;
                min-height: 52px;
            }

            .submit-button {
                min-height: 55px;
                font-size: 18px;
            }

            .success {
                margin-top: 28px;
                padding: 22px 16px;
            }

            .success h3 {
                font-size: 21px;
            }

            .success p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <header>
        <img
            src="marvion-logo.png"
            alt="MARVION Smart Healthcare Communication Platform"
            class="logo"
            style="width: 160px !important; max-width: none !important; height: auto; display: block; margin: 0 auto;">
    </header>

    <hr>

    <main>

        <h2>📅 Tempahan Janji Temu</h2>

        <p class="intro">
            Tempah janji temu dengan klinik atau hospital
            dengan lebih mudah dan teratur.
        </p>

        <div class="appointment-form">

            <!-- NAMA PESAKIT -->
            <div class="form-group">
                <label for="nama">Nama Pesakit</label>
                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama pesakit">
            </div>

            <!-- TARIKH -->
            <div class="form-group">
                <label for="tarikh">Tarikh Janji Temu</label>
                <input
                    type="date"
                    id="tarikh">
            </div>

            <!-- MASA -->
            <div class="form-group">
                <label for="masa">Masa</label>
                <input
                    type="time"
                    id="masa">
            </div>

            <!-- JENIS TEMU JANJI -->
            <div class="form-group">
                <label for="jenis">Jenis Temu Janji</label>

                <select id="jenis">
                    <option value="Pemeriksaan Kesihatan">
                        Pemeriksaan Kesihatan
                    </option>

                    <option value="Rawatan Susulan">
                        Rawatan Susulan
                    </option>

                    <option value="Konsultasi Doktor">
                        Konsultasi Doktor
                    </option>

                    <option value="Pemeriksaan Pergigian">
                        Pemeriksaan Pergigian
                    </option>
                </select>
            </div>

            <!-- BUTANG -->
            <button
                type="button"
                class="submit-button"
                onclick="hantarTempahan()">
                📩 Hantar Tempahan
            </button>

        </div>

        <!-- MESEJ BERJAYA -->
        <div
            class="success"
            id="pengesahan">

            <h3>📅 Tempahan Berjaya!</h3>

            <div id="butiranTempahan"></div>

            <p>
                Terima kasih kerana menggunakan MARVION.
            </p>

        </div>

        <!-- KEMBALI -->
        <a
            href="index.html"
            class="back-link">
            🏠 Kembali ke Laman Utama
        </a>

    </main>

    <hr>

    <footer>
        <p>© 2026 MARVION</p>
        <p>Smart Healthcare Communication Platform</p>
    </footer>


    <script>

        function hantarTempahan() {

            let nama =
                document.getElementById("nama").value.trim();

            let tarikh =
                document.getElementById("tarikh").value;

            let masa =
                document.getElementById("masa").value;

            let jenis =
                document.getElementById("jenis").value;


            /* Semak nama */
            if (nama === "") {

                alert("Sila masukkan nama pesakit.");
                return;
            }


            /* Semak tarikh */
            if (tarikh === "") {

            alert("Sila pilih tarikh janji temu.");
                return;
            }


            /* Semak masa */
            if (masa === "") {

                alert("Sila pilih masa janji temu.");
                return;
            }


            /* Paparkan pengesahan */
            document.getElementById(
                "butiranTempahan"
            ).innerHTML =

                "<p><strong>Nama:</strong> " +
                nama +
                "</p>" +

                "<p><strong>Tarikh:</strong> " +
                tarikh +
                "</p>" +

                "<p><strong>Masa:</strong> " +
                masa +
                "</p>" +

                "<p><strong>Jenis Temu Janji:</strong> " +
                jenis +
                "</p>";


            document.getElementById(
                "pengesahan"
            ).style.display = "block";


            /* Pergi ke bahagian pengesahan */
            document.getElementById(
                "pengesahan"
            ).scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

    </script>

</body>

</html>
