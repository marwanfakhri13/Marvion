<!DOCTYPE html>
<html>
<head>
    <title>Tempahan Janji Temu | Marvion</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <img src="marvion-logo.png" alt="MARVION Smart Healthcare Communication Platform" class="logo">
</header>

<main>

    <h2>📅 Tempahan Janji Temu</h2>

    <p>
        Tempah janji temu dengan klinik atau hospital
        dengan lebih mudah dan teratur.
    </p>

    <form>

        <label>Nama Pesakit</label><br>
        <input type="text" id="nama" placeholder="Masukkan nama"><br><br>

        <label>Tarikh Janji Temu</label><br>
        <input type="date" id="tarikh"><br><br>

        <label>Masa</label><br>
        <input type="time" id="masa"><br><br>

        <label>Jenis Temu Janji</label><br>

        <select id="jenis">
            <option>Pemeriksaan Kesihatan</option>
            <option>Rawatan Susulan</option>
            <option>Konsultasi Doktor</option>
            <option>Lain-lain</option>
        </select>

        <br><br>

        <button type="button" onclick="hantarTempahan()">
            ✅ Hantar Tempahan
        </button>

    </form>

    <br>

    <div id="pengesahan"></div>

    <br>

    <a href="index.html">⬅️ Kembali ke Laman Utama</a>

</main>

<script>
function hantarTempahan() {

    let nama = document.getElementById("nama").value;
    let tarikh = document.getElementById("tarikh").value;
    let masa = document.getElementById("masa").value;
    let jenis = document.getElementById("jenis").value;

    if (nama === "" || tarikh === "" || masa === "") {
        alert("⚠️ Sila lengkapkan semua maklumat tempahan.");
        return;
    }

    alert("✅ Tempahan berjaya dihantar!\n\nNama: " + nama +
          "\nTarikh: " + tarikh +
          "\nMasa: " + masa +
          "\nJenis: " + jenis);

    document.getElementById("pengesahan").innerHTML =
        "<h3>✅ Tempahan Berjaya!</h3>" +
        "<p><b>Nama:</b> " + nama + "</p>" +
        "<p><b>Tarikh:</b> " + tarikh + "</p>" +
        "<p><b>Masa:</b> " + masa + "</p>" +
        "<p><b>Jenis Temu Janji:</b> " + jenis + "</p>" +
        "<p>Terima kasih kerana menggunakan MARVION.</p>";
}
</script>

<footer>
    <p>© 2026 Marvion | Connecting Care. Empowering Lives.</p>
</footer>

</body>
</html>
